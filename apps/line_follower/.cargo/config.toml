[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# The "--probe" option is used when you have more than one compatible probe (for example):
# $ probe-rs list
#  The following debug probes were found:
#  [0]: STLink V2 -- 0483:3748:60 (ST-LINK)               <-- We want to use this one
#  [1]: ESP JTAG -- 303a:1001:B0:81:84:05:F6:D4 (EspJtag) <-- We also have a ESP c3 connected that we don't want to program
runner = "probe-rs run --chip STM32F103CB --probe 0483:3748:60"
# runner = "probe-rs run --chip STM32F103CB"
# runner = ["probe-rs", "run", "--chip", "$CHIP", "--log-format", "{L} {s}"]

rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  # This is needed if your flash or ram addresses are not aligned to 0x10000 in memory.x
  # See https://github.com/rust-embedded/cortex-m-quickstart/pull/95
  "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv7m-none-eabi"    # Cortex-M3

[alias]
rb = "run --bin"
rrb = "run --release --bin"
