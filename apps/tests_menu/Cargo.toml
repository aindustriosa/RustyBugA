[package]
name = "tests_menu"
version = "0.1.0"
authors = ["Jorge Muñoz <punkto@gmail.com>"]
description = "Basic app that uses libs and BSC to print something and make demos"
categories = ["embedded", "no-std"]
edition = "2021"

[dependencies]
mightybuga_bsc = { path = "../../mightybuga_bsc" }
mightybuga_bsc_interface = { path = "../../libs/mightybuga_bsc_interface" }

bsc_tests_menu = { path = "../../libs/bsc_tests_menu" }


[profile.release]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size on Flash
lto = true # better optimizations
